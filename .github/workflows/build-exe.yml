name: Build

# Every push is compile-checked on Linux, and the Windows-ready .exe
# installer is built on the windows runner (Java is bundled inside,
# so the final users install nothing but your app).
# Single-process edition: online Supabase only (no clinic server).

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  compile-check:
    name: Compile check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven package (frontend)
        run: mvn -B -ntp -DskipTests package

  windows-exe:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven package + collect runtime jars
        shell: pwsh
        run: |
          mvn -B -ntp -DskipTests package
          New-Item -ItemType Directory -Force target\pkg | Out-Null
          mvn -B -ntp -DincludeScope=runtime dependency:copy-dependencies "-DoutputDirectory=$((Get-Location).Path)\target\pkg"
          Copy-Item frontend\target\vetms-4.0.0.jar target\pkg\


      - name: Fetch Dynamsoft Java jar (best effort, optional)
        continue-on-error: true
        shell: pwsh
        run: |
          $baseHttps = "https://download2.dynamsoft.com/maven/dbr/jar/com/dynamsoft/dbr"
          $baseHttp  = "http://download2.dynamsoft.com/maven/dbr/jar/com/dynamsoft/dbr"
          $versions = @()
          foreach ($base in @($baseHttps, $baseHttp)) {
            try {
              $x = [xml](Invoke-WebRequest -UseBasicParsing "$base/maven-metadata.xml" -SkipCertificateCheck -TimeoutSec 15).Content
              $cand = @($x.metadata.versioning.versions.version | Where-Object { $_ -and $_ -notmatch "SNAPSHOT|alpha|beta|rc" } | Select-Object -Last 2)
              if ($cand.Count -gt 0) { $versions += $cand; break }
            } catch { Write-Host "metadata unreadable from $base : $($_.Exception.Message)" }
          }
          $versions += @("9.6.40.1", "9.6.40", "9.6.0", "11.6.3000")
          $versions = $versions | Where-Object { $_ } | Select-Object -Unique
          $ok = $false
          foreach ($v in $versions) {
            foreach ($base in @($baseHttps, $baseHttp)) {
              try {
                Write-Host "Trying Dynamsoft $v from $base ..."
                Invoke-WebRequest -UseBasicParsing "$base/$v/dbr-$v.jar" -OutFile "target\pkg\dbr.jar" -SkipCertificateCheck -TimeoutSec 20
                if ((Get-Item "target\pkg\dbr.jar").Length -gt 400KB) {
                  $ok = $true; Write-Host "Dynamsoft jar bundled (version $v from $base, $((Get-Item target\pkg\dbr.jar).Length) bytes)"; break
                } else { Write-Host "  $v too small: $((Get-Item target\pkg\dbr.jar).Length) bytes" }
              } catch { Write-Host "  $v not downloadable from $base : $($_.Exception.Message)" }
            }
            if ($ok) { break }
          }
          if (-not $ok) {
            Write-Host "Direct download failed -> trying Maven dependency:get ..."
            try {
              mvn -B -ntp dependency:get "-Dartifact=com.dynamsoft:dbr:9.6.40" "-DremoteRepositories=dbr::default::https://download2.dynamsoft.com/maven/dbr/jar" "-Dtransitive=false" 2>&1 | Out-String | Write-Host
              $local = "$env:USERPROFILE\.m2\repository\com\dynamsoft\dbr\9.6.40\dbr-9.6.40.jar"
              if (Test-Path $local) {
                Copy-Item $local "target\pkg\dbr.jar" -Force; $ok = $true
                Write-Host "Maven fetched $local -> copied ($((Get-Item target\pkg\dbr.jar).Length) bytes)"
              } else {
                $found = Get-ChildItem "$env:USERPROFILE\.m2\repository\com\dynamsoft\dbr" -Recurse -Filter "dbr-*.jar" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
                if ($found) { Copy-Item $found.FullName "target\pkg\dbr.jar" -Force; $ok=$true; Write-Host "Found $($found.FullName) ($($found.Length) bytes) -> copied" }
              }
            } catch { Write-Host "Maven fetch failed: $_" }
          }
          if (Test-Path "target\pkg\dbr.jar") {
            Write-Host "dbr.jar present: $((Get-Item target\pkg\dbr.jar).Length) bytes"
            Get-ChildItem target\pkg\*.jar | ForEach-Object { Write-Host "  pkg: $($_.Name) $($_.Length)" }
            if (-not (Get-ChildItem target\pkg\webcam-capture-*.jar -ErrorAction SilentlyContinue)) { Write-Host "WARNING: webcam-capture jar NOT in pkg — fallback camera will not work" }
          }
          if (-not $ok -or -not (Test-Path "target\pkg\dbr.jar")) {
            Write-Host "DBR JAR UNAVAILABLE - installer will use the free ZXing engine only (saving a key will show 'not bundled' but scanning still works)"
          }

      - name: Download JavaFX jmods (Windows, LTS 21 with 25 fallback)
        shell: pwsh
        run: |
          $got = $null
          foreach ($v in @("21.0.5", "25.0.4")) {
            try {
              Invoke-WebRequest -Uri "https://download2.gluonhq.com/openjfx/$v/openjfx-${v}_windows-x64_bin-jmods.zip" -OutFile jmods.zip
              if ((Get-Item jmods.zip).Length -gt 5MB) { $got = $v; break }
            } catch { Write-Host "jmods $v not downloadable" }
          }
          if (-not $got) { throw "No JavaFX jmods downloadable" }
          Set-Content -NoNewline target\jmods.version $got
          Expand-Archive jmods.zip -DestinationPath target\jmods

      - name: Create embedded runtime image (jlink)
        shell: pwsh
        run: |
          $dir = (Get-ChildItem target\jmods -Directory | Where-Object Name -like "javafx-jmods-*" | Select-Object -First 1).Name
          if (-not $dir) { throw "No extracted jmods folder found under target\jmods" }
          $jfxv = $dir -replace "javafx-jmods-", ""
          Write-Host "Using JavaFX jmods $jfxv"
          jlink --module-path "target\jmods\javafx-jmods-$jfxv;$env:JAVA_HOME\jmods" `
            --add-modules java.base,java.desktop,java.instrument,java.management,java.naming,java.net.http,java.prefs,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.transaction.xa,java.xml,javafx.base,javafx.graphics,javafx.controls,javafx.swing,javafx.fxml,jdk.crypto.ec,jdk.crypto.mscapi,jdk.jfr,jdk.localedata,jdk.zipfs,jdk.unsupported `
            --strip-debug --no-man-pages --no-header-files --compress=zip-6 `
            --output target\runtime

      - name: Install Inno Setup (builds the .exe installer)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          Add-Content $env:GITHUB_PATH (Split-Path $iscc)
          Write-Host "Inno Setup ready"

      - name: Package app folder (jpackage app-image) + Inno installer
        shell: pwsh
        run: |
          jpackage --verbose --type app-image `
            --input target\pkg `
            --main-jar vetms-4.0.0.jar `
            --main-class dev.parent.Launcher `
            --runtime-image target\runtime `
            --name VetCustomerManager `
            --app-version 4.0.0 `
            --vendor "AAB" `
            --description "Veterinary Customer Manager (Supabase online edition)" `
            --icon packaging\icon.ico `
            --java-options "-Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED" `
            --dest dist\app-image
          ISCC.exe packaging\installer.iss
          Get-ChildItem dist\installer

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: VetCustomerManager-Windows-EXE
          path: dist\installer\*.exe
          retention-days: 90
